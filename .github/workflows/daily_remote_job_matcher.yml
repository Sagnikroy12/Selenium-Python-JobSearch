name: Daily Remote Job Matcher

on:
  schedule:
    # 07:15 AM Asia/Kolkata is 01:45 UTC
    - cron: "45 1 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-trigger]
    inputs:
      resume_pdf_path:
        description: "Resume PDF path inside the repository or mounted workspace"
        required: false
        default: "Sagnik_Roy_SDET_21-09-2026.pdf"
      job_title_target:
        description: "Job title or keyword search target"
        required: false
        default: "SDET"
      job_location_target:
        description: "Job location search target"
        required: false
        default: "Remote"
      recipient_email:
        description: "Email address that receives the top 10 remote match report"
        required: false
        default: "morphgamingstop@gmail.com"
      user_experience_years:
        description: "User experience in years for ATS matching"
        required: false
        default: "3.5"
  repository_dispatch:
    types: [daily-remote-trigger]

jobs:
  run-remote-job-matcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directories
        run: mkdir -p artifacts reports

      - name: Build Docker image
        run: docker build -t daily-remote-job-matcher .

      - name: Verify resume file exists
        run: |
          RESUME_PDF_PATH="${{ inputs.resume_pdf_path || 'Sagnik_Roy_SDET_21-09-2026.pdf' }}"
          echo "--- Workspace root listing ---"
          ls -la "${{ github.workspace }}"
          echo "--- Looking for resume: ${RESUME_PDF_PATH} ---"
          if [ -f "${{ github.workspace }}/${RESUME_PDF_PATH}" ]; then
            echo "✅ Resume found: ${{ github.workspace }}/${RESUME_PDF_PATH}"
          elif [ -f "${{ github.workspace }}/Sagnik Roy_SDET_21-09-2026.pdf" ]; then
            echo "✅ Resume found: ${{ github.workspace }}/Sagnik Roy_SDET_21-09-2026.pdf"
          else
            echo "❌ Resume NOT found at: ${{ github.workspace }}/${RESUME_PDF_PATH}"
            echo "Available PDF files:"
            find "${{ github.workspace }}" -maxdepth 2 -name '*.pdf' -type f 2>/dev/null || echo "  (none)"
            exit 1
          fi

      - name: Run remote scraper, ATS matcher, and email report
        env:
          INPUT_RESUME: ${{ inputs.resume_pdf_path }}
          INPUT_TITLE: ${{ inputs.job_title_target }}
          INPUT_LOCATION: ${{ inputs.job_location_target }}
          INPUT_EMAIL: ${{ inputs.recipient_email }}
          INPUT_EXP: ${{ inputs.user_experience_years }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          EMAIL_SUBJECT: ${{ secrets.EMAIL_SUBJECT }}
        run: |
          # Explicitly self-contained: Does NOT read repo vars.* to eliminate variable collisions
          RESUME_PDF_PATH="${INPUT_RESUME:-Sagnik_Roy_SDET_21-09-2026.pdf}"
          JOB_TITLE_TARGET="${INPUT_TITLE:-SDET}"
          JOB_LOCATION_TARGET="${INPUT_LOCATION:-Remote}"
          RECIPIENT_EMAIL="${INPUT_EMAIL:-morphgamingstop@gmail.com}"
          USER_EXPERIENCE_YEARS="${INPUT_EXP:-3.5}"
          FINAL_SMTP_PORT="${SMTP_PORT:-587}"
          FINAL_EMAIL_SUBJECT="${EMAIL_SUBJECT:-Daily Remote ATS Job Match Report}"

          docker run --rm \
            -e HEADLESS=true \
            -e RESUME_PDF_PATH="/app/workspace/${RESUME_PDF_PATH}" \
            -e JOB_TITLE_TARGET="${JOB_TITLE_TARGET}" \
            -e JOB_LOCATION_TARGET="${JOB_LOCATION_TARGET}" \
            -e RECIPIENT_EMAIL="${RECIPIENT_EMAIL}" \
            -e USER_EXPERIENCE_YEARS="${USER_EXPERIENCE_YEARS}" \
            -e SEND_EMAIL=true \
            -e SMTP_HOST="${SMTP_HOST}" \
            -e SMTP_PORT="${FINAL_SMTP_PORT}" \
            -e SMTP_USERNAME="${SMTP_USERNAME}" \
            -e SMTP_PASSWORD="${SMTP_PASSWORD}" \
            -e MAIL_FROM="${MAIL_FROM}" \
            -e EMAIL_SUBJECT="${FINAL_EMAIL_SUBJECT}" \
            -v "${{ github.workspace }}:/app/workspace:ro" \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            -v "${{ github.workspace }}/reports:/app/reports" \
            daily-remote-job-matcher

      - name: Upload scored Remote Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scored-remote-linkedin-jobs
          path: artifacts/linkedin_jobs.xlsx
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remote-selenium-failure-screenshots
          path: reports/
          if-no-files-found: ignore
